
name: Build TorrentBox APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleBaseDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: TorrentBox-APK
          path: app/build/outputs/apk/base/debug/*.apk
          if-no-files-found: error
          
